name: Test, build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Test, build, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Size budgets
        run: npm run size

  perf:
    name: Draw-time gate (vs v1.0.0)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the gate compares against the v1.0.0 tag
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Perf gate
        # CI runners are noisy: only a clear regression fails the build.
        run: node scripts/perf.mjs
        env:
          MAX: 4
          RUNS: 6
          PORT: 8123

  build:
    name: Assemble site
    needs: [check, perf]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets playground src dist docs c LICENSE _site/
          rm -rf _site/docs/src _site/docs/build.mjs _site/docs/screenshots.mjs
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  release-branch:
    name: Publish to the release branch
    needs: [check, perf]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run release-branch
      - name: Commit to the release branch
        # History is kept (no force push), so installs pinned to a commit keep working.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          if git fetch origin release 2>/dev/null; then
            git worktree add rel origin/release
            git -C rel checkout -B release
          else
            git worktree add --orphan -b release rel
          fi
          find rel -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r release/. rel/
          cd rel
          git add -A
          if git diff --cached --quiet; then echo "release branch is up to date"; exit 0; fi
          git commit -m "v$VERSION from ${GITHUB_SHA::7}"
          git push origin release

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
